<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éditeur de Carte — /map/admin</title>
  <link rel="stylesheet" href="/css/map-admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="admin-app">
    <aside class="admin-sidebar">
      <div class="admin-header">
        <div>
          <span class="badge-admin">MAP ADMIN</span>
          <h1>Éditeur de Réseau</h1>
        </div>
        <a href="/map" class="btn-link">← Voir /map</a>
      </div>

      <div class="tool-section">
        <label class="section-label">Outil actif</label>
        <div class="tool-grid" id="tool-grid">
          <button type="button" class="tool-btn active" data-tool="stop">📍 Arrêt</button>
          <button type="button" class="tool-btn" data-tool="line">🚇 Ligne</button>
          <button type="button" class="tool-btn" data-tool="road">🛣️ Rue</button>
          <button type="button" class="tool-btn" data-tool="water">💧 Eau</button>
          <button type="button" class="tool-btn" data-tool="land">🌿 Terre</button>
          <button type="button" class="tool-btn" data-tool="building">🏢 Bâtiment</button>
          <button type="button" class="tool-btn" data-tool="connector">🔗 Fil</button>
          <button type="button" class="tool-btn" data-tool="pan">✋ Déplacer</button>
        </div>
      </div>

      <div class="tool-section" id="prop-stop">
        <label class="section-label">Propriétés Arrêt</label>
        <input type="text" id="stop-name" placeholder="Nom de l'arrêt (ex: Gare Routière)">
        <input type="text" id="stop-lines" placeholder="Lignes (ex: T1, T2, 15)">
        <label class="checkbox-row">
          <input type="checkbox" id="stop-pole"> Pôle de mobilité
        </label>
      </div>

      <div class="tool-section hidden" id="prop-draw">
        <label class="section-label">Propriétés Tracé</label>
        <input type="text" id="draw-label" placeholder="Nom / ID (ex: T1, Rue Lacerne)">
        <div class="row-inline">
          <label>Couleur</label>
          <input type="color" id="draw-color" value="#ef4444">
        </div>
        <div class="row-inline">
          <label>Épaisseur (<span id="width-val">6</span>px)</label>
          <input type="range" id="draw-width" min="2" max="40" value="6">
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="draw-dashed"> Pointillés
        </label>
        <div class="draw-actions">
          <button type="button" id="btn-finish-path" class="btn-primary">Terminer le tracé (Entrée)</button>
          <button type="button" id="btn-cancel-path" class="btn-secondary">Annuler</button>
        </div>
      </div>

      <div class="tool-section">
        <label class="section-label">Fond de carte (référence)</label>
        <div class="row-inline">
          <label>Opacité (<span id="bg-opacity-val">60</span>%)</label>
          <input type="range" id="bg-opacity" min="0" max="100" value="60">
        </div>
      </div>

      <div class="tool-section">
        <label class="section-label">Actions</label>
        <div class="draw-actions">
          <button type="button" id="btn-undo" class="btn-secondary">↩ Annuler dernier</button>
          <button type="button" id="btn-clear" class="btn-danger">🗑️ Tout effacer</button>
        </div>
        <button type="button" id="btn-export" class="btn-primary" style="margin-top:8px;">📋 Copier JSON</button>
      </div>

      <div class="elements-count" id="elements-count">
        0 arrêts · 0 tracés
      </div>
    </aside>

    <main class="admin-viewport" id="admin-viewport">
      <svg id="admin-svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid meet">
        <g id="admin-world">
          <image id="bg-image" href="/assets/img/plan-reseau.jpg" x="0" y="0" width="1200" height="1000" opacity="0.6" />
          <g id="layer-land"></g>
          <g id="layer-water"></g>
          <g id="layer-buildings"></g>
          <g id="layer-roads"></g>
          <g id="layer-lines"></g>
          <g id="layer-preview"></g>
          <g id="layer-stops"></g>
        </g>
      </svg>

      <div class="map-controls">
        <button type="button" id="btn-zoom-in" title="Zoomer">+</button>
        <button type="button" id="btn-zoom-out" title="Dézoomer">−</button>
        <button type="button" id="btn-zoom-reset" title="Réinitialiser">⌖</button>
      </div>
      <div class="coords-indicator" id="coords-indicator">X: 0 · Y: 0 · 100%</div>
      <div id="context-menu" class="context-menu hidden">
        <button type="button" id="ctx-add-point">➕ Ajouter un point après</button>
        <button type="button" id="ctx-edit">✏️ Modifier</button>
        <button type="button" id="ctx-delete" class="danger">🗑️ Supprimer</button>
      </div>
    </main>
  </div>

  <script src="/js/map-admin.js"></script>
</body>
</html>
